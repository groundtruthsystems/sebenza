name: CI

# Runs every test suite on pushes and pull requests: the Rust workspace, the
# frontend, and the stdlib-only Python tests of the Sebenza skills plugin.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  skills:
    name: Skills plugin (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unittests (stdlib only)
        run: python3 -m unittest discover -s skills/scripts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci
          npm test
          npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake tmux
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The server embeds frontend/dist, so build it first.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
